name: Verify test distribution
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v test_app
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/n8n/test/*.test.mjs
      - run: docker build -t nutri-bridge-test .
      - name: Check API container
        run: |
          docker run -d --name nutri-ci -p 127.0.0.1:8080:8080 -e NUTRI_SERVICE_TOKEN=ci-only-not-a-real-token-0123456789abcdef nutri-bridge-test
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
      - if: always()
        run: docker rm -f nutri-ci || true
